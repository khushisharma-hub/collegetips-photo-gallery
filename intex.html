<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CollegeTips Photo Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/css/lightbox.min.css">
  <style>
    .filter-btn.active {
      background-color: #3b82f6;
      color: white;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <div class="max-w-7xl mx-auto p-4">
    <h1 class="text-4xl font-bold text-center mb-8">📸 CollegeTips Moments Gallery</h1>

    <!-- FILTER BUTTONS -->
    <div class="flex flex-wrap justify-center gap-4 mb-8">
      <button onclick="filterImages('all')" class="filter-btn active px-4 py-2 rounded border">All</button>
      <button onclick="filterImages('team')" class="filter-btn px-4 py-2 rounded border">Team Vibes</button>
      <button onclick="filterImages('campaigns')" class="filter-btn px-4 py-2 rounded border">Creative Campaigns</button>
      <button onclick="filterImages('fun')" class="filter-btn px-4 py-2 rounded border">Work Hard, Play Hard</button>
      <button onclick="filterImages('bts')" class="filter-btn px-4 py-2 rounded border">Behind-The-Scenes</button>
    </div>

    <!-- IMAGE GRID -->
    <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Sample Image -->
      <a href="https://source.unsplash.com/random/800x600?sig=1" data-lightbox="gallery" data-title="Team Vibes" class="image-card team transition-transform hover:scale-105">
        <img src="https://source.unsplash.com/random/400x300?sig=1" alt="Team" class="rounded shadow-md">
      </a>

      <a href="https://source.unsplash.com/random/800x600?sig=2" data-lightbox="gallery" data-title="Creative Campaigns" class="image-card campaigns transition-transform hover:scale-105">
        <img src="https://source.unsplash.com/random/400x300?sig=2" alt="Campaign" class="rounded shadow-md">
      </a>

      <a href="https://source.unsplash.com/random/800x600?sig=3" data-lightbox="gallery" data-title="Work Hard, Play Hard" class="image-card fun transition-transform hover:scale-105">
        <img src="https://source.unsplash.com/random/400x300?sig=3" alt="Fun" class="rounded shadow-md">
      </a>

      <a href="https://source.unsplash.com/random/800x600?sig=4" data-lightbox="gallery" data-title="Behind-The-Scenes" class="image-card bts transition-transform hover:scale-105">
        <img src="https://source.unsplash.com/random/400x300?sig=4" alt="BTS" class="rounded shadow-md">
      </a>

      <!-- Add more images as needed -->
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.3/js/lightbox.min.js"></script>
  <script>
    function filterImages(category) {
      const images = document.querySelectorAll('.image-card');
      const buttons = document.querySelectorAll('.filter-btn');

      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      images.forEach(img => {
        if (category === 'all' || img.classList.contains(category)) {
          img.style.display = 'block';
        } else {
          img.style.display = 'none';
        }
      });
    }
  </script>

</body>
</html>
